# ELMONITOR A2 - offline tests only (manual).
#
# The scheduled data update runs on Vercel (apps/web/app/api/cron/a2/route.ts + apps/web/vercel.json), by owner
# choice 2026-11-05: no keys on GitHub. This workflow uses no secrets, reaches no store and starts no data run.
# It does not push, deploy, use SSH or call other workflows; deploy.yml triggers on push to "main" only.

name: Elmonitor A2 tests

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: elmonitor-a2-tests
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned dependencies (root package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Offline tests (no network, no secret)
        run: |
          npx --yes tsx@4.23.12 pipeline/a2/test/test_a2.ts
          npx --yes tsx@4.23.12 pipeline/a2/test/test_blob_store.ts
          npx --yes tsx@4.23.12 pipeline/a2/test/test_generation.ts
